<!DOCTYPE html>
<html>
<head>
    <title>Audio</title>
</head>
<body>
    <p>
        Surah Al-Mulk
    </p>
    <!--audio controls autoplay will make the audio keep playing-->
    <audio controls muted loop>
        <source src="Audios/Surah Al Mulk.mp3" type="audio/mpeg">
        <source src="Audios/Surah Al Mulk.wav" type="audio/wav">
    </audio>
    
    <!--If mp3 is not supported then they would look for wav if available-->
    <p>
        Surah Al-Ikhlas
    </p>

    <audio src="Audios/Surah Al-Ikhlas.mp3" controls></audio>

</body>
</html>
